name: CI

# Every pushed branch: topic branches are pushed as they go, and their checks gate the merge into
# development. Pull requests into development and main run them again on the merged result.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The app ships for Windows, and the daemon's tests drive real git there.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test the daemon
        working-directory: packages/daemon
        run: bun test
      - name: Test the desktop app
        working-directory: apps/desktop
        run: bun test
      - name: Test the relay contract
        working-directory: packages/relay-contract
        run: bun test
      - name: Test the relay Worker
        working-directory: apps/relay
        run: bun run test
