<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zomfy</title>
    <script>
      // Theme before first paint, from the same setting lib/theme.ts applies later, so the boot
      // screen below never flashes the wrong palette.
      try {
        // The module bundle renames legacy keys later; until then the setting may still be under its legacy key.
        var saved = localStorage.getItem('zomfy.settings.v1') || localStorage.getItem('acp-harness.settings.v1') // legacy
        var theme = JSON.parse(saved || '{}').theme || 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        // The left sidebar at the width the person left it (stores/sidebar-width-store.ts clamps the same way).
        var left = JSON.parse(localStorage.getItem('zomfy.sidebar-widths.v1') || '{}').left
        if (typeof left === 'number') document.documentElement.style.setProperty('--boot-sidebar-width', Math.round(Math.min(520, Math.max(200, left))) + 'px')
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/boot.css" />
    <!-- The UI font, fetched with the page rather than once the app's styles ask for it, so text is not drawn twice. -->
    <link rel="preload" href="/src/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="boot" aria-hidden="true">
      <div id="boot-body">
        <div id="boot-sidebar"></div>
        <div id="boot-main"><div id="boot-spinner"></div>Starting Zomfy…</div>
      </div>
      <div id="boot-status"></div>
    </div>
    <div id="root"></div>
    <script>
      // The main window opens hidden at its remembered size; show it now the boot screen is in place.
      try {
        window.__TAURI_INTERNALS__ &&
          window.__TAURI_INTERNALS__.invoke('window_ready', { dark: document.documentElement.classList.contains('dark') })
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
