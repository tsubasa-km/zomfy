<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zomfy</title>
    <script>
      // Theme before first paint, from the same setting lib/theme.ts applies later, so the boot
      // screen below never flashes the wrong palette.
      try {
        var theme = JSON.parse(localStorage.getItem('acp-harness.settings.v1') || '{}').theme || 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/boot.css" />
  </head>

  <body>
    <div id="boot" aria-hidden="true">
      <div id="boot-sidebar"></div>
      <div id="boot-main"><div id="boot-spinner"></div>Starting Zomfy…</div>
    </div>
    <div id="root"></div>
    <script>
      // The main window opens hidden at its remembered size; show it now the boot screen is in place.
      try {
        window.__TAURI_INTERNALS__ &&
          window.__TAURI_INTERNALS__.invoke('window_ready', { dark: document.documentElement.classList.contains('dark') })
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
